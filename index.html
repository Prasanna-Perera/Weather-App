<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search_location_on" />

</head>

<body>
    <main class="main-Box">
        <header class="input-container">
            <input class="city-input" placeholder="Search City" type="text">
            <button class="Search-btn">
                <span class="material-symbols-outlined">
                    search
                </span>
            </button>
        </header>

        <section class="Weather-info" style="display: none;"> //"hide box"
            <div class="location-date-container">
                <div class="locationa">
                    <span class="material-symbols-outlined">
                        location_on
                    </span>
                    <h4 class="country-txt">Sri Lanka</h4>
                </div>
                <h5 class="current-date-txt regular-txt">sun, 07 Nov</h5>
            </div>

            <div class="weather-summary-container">
                <img src="assets\cloud.png" class="weather-summary-img">
                <div class="weather-summary-info">
                    <h1 class="temp-txt">29°C</h1>
                    <h3 class="condition-txt regular-txt">Clouds</h3>
                </div>
            </div>

            <div class="weather-conditions-container">
                <div class="conditions-item">
                    <span class="material-symbols-outlined">
                        water_drop
                    </span>
                    <div class="condition-info">
                        <h5 class="regular-text">Humidity</h5>
                        <h5 class="Humidity-value-text">50%</h5>
                    </div>
                </div>

                <div class="conditions-item">
                    <span class="material-symbols-outlined">
                        air
                    </span>
                    <div class="condition-info">
                        <h5 class="regular-text">Wind Speed</h5>
                        <h5 class="Wind-value-text">3 M/s</h5>
                    </div>
                </div>
            </div>
            <div class="forecast-items-container">
                <div class="forecast-item">
                    <h5 class="forecast-item-date regular-text">05 Nov</h5>
                    <img src="assets/thunder.png" class="forecast-item-img">
                    <h5 class="forecast-item-temp">29 °C</h5>
                </div>
                <div class="forecast-item">
                    <h5 class="forecast-item-date regular-text">05 Nov</h5>
                    <img src="assets/thunder.png" class="forecast-item-img">
                    <h5 class="forecast-item-temp">29 °C</h5>
                </div>
                <div class="forecast-item">
                    <h5 class="forecast-item-date regular-text">05 Nov</h5>
                    <img src="assets/thunder.png" class="forecast-item-img">
                    <h5 class="forecast-item-temp">29 °C</h5>
                </div>
                <div class="forecast-item">
                    <h5 class="forecast-item-date regular-text">05 Nov</h5>
                    <img src="assets/thunder.png" class="forecast-item-img">
                    <h5 class="forecast-item-temp">29 °C</h5>
                </div>
            </div>
        </section>

        <section class="search-city section-msg ">
            <img src="assets/Search.png">
            <div>
                <h1>Search City</h1>
                <h4 class="regular-txt">
                    Find out the weather Conditions of the City
                </h4>

            </div>
        </section>

        <section class="not-found-search-city section-msg" style="display: none;">
            <img src="assets/Not.png">
            <div>
                <h1>City not Found</h1>
                <h4 class="regular-txt">
                    Find out the weather Conditions of the City
                </h4>

            </div>
        </section>
    </main>


    <script src="app.js"></script>
</body>

</html>
